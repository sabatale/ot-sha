name: Update OT SHA Secrets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  pull_request:
    paths:
      - '**.js'
      - 'package*.json'
      - '.github/workflows/scrape.yml'

permissions:
  contents: read

concurrency:
  group: ot-sha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: npm ci
      - run: npm test
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}

  update:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: npm ci
      - name: Extract fresh query hashes
        id: scraper
        run: npm start
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Publish run summary
        if: always()
        env:
          SCRAPER_OUTCOME: ${{ steps.scraper.outcome }}
        run: |
          echo "## OpenTable hash extraction" >> "$GITHUB_STEP_SUMMARY"
          echo "Scraper outcome: $SCRAPER_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ -f temp/run-report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat temp/run-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-diagnostics
          path: temp/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit fresh results
        if: success() && steps.scraper.outcome == 'success'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add secrets/secrets.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: Automatic update of OT SHA values"
            git push
          fi
