name: Update OT SHA Secrets

on:
  workflow_dispatch:
  schedule:
    # One job per run: Actions bills each job as a whole minute, so splitting it would triple the cost.
    - cron: '17 */3 * * *'
  pull_request:
    paths:
      - '**.js'
      - 'package*.json'
      - '.github/workflows/scrape.yml'

permissions:
  contents: read

concurrency:
  group: ot-sha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check consecutive refresh failures
        id: policy
        if: github.event_name != 'pull_request'
        run: node scripts/notification-policy.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        continue-on-error: ${{ steps.policy.outputs.tolerate == 'true' }}
        with:
          chrome-version: stable
      - id: install
        if: steps.chrome.outcome == 'success'
        continue-on-error: ${{ steps.policy.outputs.tolerate == 'true' }}
        run: npm ci
      - id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: ${{ steps.policy.outputs.tolerate == 'true' }}
        run: npm test
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Extract fresh query hashes
        id: scraper
        if: github.event_name != 'pull_request' && steps.tests.outcome == 'success'
        continue-on-error: ${{ steps.policy.outputs.tolerate == 'true' }}
        run: npm start
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Publish run summary
        if: always() && github.event_name != 'pull_request'
        env:
          SCRAPER_OUTCOME: ${{ steps.scraper.outcome }}
        run: |
          echo "## OpenTable hash extraction" >> "$GITHUB_STEP_SUMMARY"
          echo "Scraper outcome: $SCRAPER_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ -f temp/run-report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat temp/run-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: scrape-diagnostics
          path: temp/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit fresh results
        id: commit
        if: steps.scraper.outcome == 'success'
        continue-on-error: ${{ steps.policy.outputs.tolerate == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add secrets/secrets.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: Automatic update of OT SHA values"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"${GITHUB_REF_NAME}"
          fi

      # Tolerated failures leave the job green, so this step is the failure record the next run's policy reads.
      - name: Tolerated refresh failure
        if: >-
          always() && steps.policy.outputs.tolerate == 'true' &&
          (steps.chrome.outcome == 'failure' || steps.install.outcome == 'failure' ||
          steps.tests.outcome == 'failure' || steps.scraper.outcome == 'failure' || steps.commit.outcome == 'failure')
        run: echo "A refresh step failed; this run is tolerated and counts toward the failure streak." >> "$GITHUB_STEP_SUMMARY"
